<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Point of Sale System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container mt-5">
    <div class="row">
      <!-- Left Column -->
      <div class="col-md-4 mb-4">
        <h5 class="text-primary">BSc<br><span class="fw-light">ISTN3AS</span></h5>
        <h3>Checkmate POS</h3>
        <div class="mt-4">
          <h6 class="text-muted">Project scenario</h6>
          <p id="project-scenario" class="text-secondary"></p>
        </div>
        <div class="mt-3">
          <h6 class="text-muted">Skills demonstrated</h6>
          <div id="skills" class="d-flex flex-wrap gap-2"></div>
        </div>
        <div class="mt-3">
          <h6 class="text-muted">Tools used</h6>
          <div id="tools" class="badge bg-secondary"></div>
        </div>
      </div>

      <!-- Right Column -->
      <div class="col-md-8">
        <div class="border p-4 rounded shadow-sm bg-white">
          <h5>Summary</h5>
          <p id="summary"></p>

          <h5 class="mt-4">Solution</h5>
          <p id="solution"></p>

          <h5 class="mt-4">Approach</h5>
          <p id="approach"></p>

          <div class="mt-4">
            <h6>Project link</h6>
            <a href="#" id="project-link" target="_blank" class="d-block text-decoration-none">
              <div class="bg-light p-2 rounded text-primary">
                🔗 View Project
              </div>
            </a>
          </div>
          <p class="text-muted mt-2">Completed</p>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
